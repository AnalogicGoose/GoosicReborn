[workspace]
resolver = "2"
members = [
    "crates/goosic-protocol",
    "crates/goosic-core",
    "crates/goosic-catalog",
    "crates/goosic-settings",
    "crates/goosic-downloads",
    "crates/goosic-lyrics",
    "crates/goosic-accounts",
    "crates/goosic-service",
]

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"
rust-version = "1.88"

[workspace.dependencies]
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
libc = "0.2"
tempfile = "3"
url = "2"
uuid = { version = "1.0", features = ["v4"] }
rusqlite = { version = "0.32", features = ["bundled"] }
ureq = { version = "3", default-features = false, features = ["rustls", "json", "gzip"] }

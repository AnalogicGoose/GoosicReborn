name: GoosicMacUITests
options:
  minimumXcodeGenVersion: 2.38.0
packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.10.0
targets:
  GoosicDebugHost:
    type: application
    platform: macOS
    deploymentTarget: "14.0"
    sources:
      - path: Host
      - path: ../../apps/goosic-swift/Sources/GoosicSwift
        excludes: [Resources]
    resources:
      - path: ../../apps/goosic-swift/Sources/GoosicSwift/Resources
    dependencies:
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goosic.debug-host
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: GOOSIC_UI_TEST_HOST
  GoosicDebugHostUITests:
    type: bundle.ui-testing
    platform: macOS
    deploymentTarget: "14.0"
    sources: [Tests]
    dependencies:
      - target: GoosicDebugHost
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goosic.debug-host-uitests
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "6.0"
        CODE_SIGNING_ALLOWED: YES
        CODE_SIGN_IDENTITY: "-"
schemes:
  GoosicDebugHost:
    build:
      targets:
        GoosicDebugHost: all
        GoosicDebugHostUITests: [test]
    test:
      targets: [GoosicDebugHostUITests]

[package]
name = "goosic-shell-support-ffi"
version.workspace = true
edition.workspace = true
license.workspace = true

# A C ABI over `goosic-shell-support`, for shells that are not written in Rust. The Linux shell
# links the crate directly and has no use for this. The Windows shell is C# and loads the cdylib;
# the macOS shell links the staticlib, so the app bundle carries no extra library.
[lib]
crate-type = ["cdylib", "staticlib", "rlib"]

[dependencies]
goosic-protocol = { path = "../goosic-protocol" }
goosic-shell-support = { path = "../goosic-shell-support" }
serde = { workspace = true }
serde_json = { workspace = true }
uuid = { workspace = true }

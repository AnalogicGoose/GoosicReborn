name: Windows build check (temporary)
on:
    push:
        branches: [ci/windows-build-check]
jobs:
    windows:
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-pc-windows-msvc
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '9.0.x'
            - run: dotnet test apps/goosic-windows/Goosic.Windows.Tests/Goosic.Windows.Tests.csproj
            - run: ./apps/goosic-windows/package.ps1 -Version 0.2.8 -Platform x64

name: Release

# Downloads stay draft until their hashes and contents have been checked.
on:
    push:
        tags: ['v*', '!v*-macos-*']
permissions:
    contents: write
jobs:
    macos:
        name: Goosic.app (macOS, universal alpha)
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-apple-darwin,x86_64-apple-darwin
            - name: Test the release tree
              run: make test
            - name: Package and verify the app
              run: |
                  version="${GITHUB_REF_NAME#v}"
                  GOOSIC_MACOS_BUILD_VERSION=3 sh tools/package-macos.sh "$version"
                  unzip -q "dist/Goosic-$version-macos-universal.zip" -d dist/verify
                  app=dist/verify/Goosic.app
                  codesign --verify --deep --strict "$app"
                  lipo -verify_arch arm64 x86_64 "$app/Contents/MacOS/Goosic"
                  lipo -verify_arch arm64 x86_64 "$app/Contents/MacOS/goosic-service"
                  test -d "$app/Contents/Frameworks/Sparkle.framework"
                  test -f "$app/Contents/Resources/LICENSE-GPL-3.0"
                  cd dist
                  shasum -a 256 "Goosic-$version-macos-universal.zip" > SHA256SUMS-macos.txt
            - uses: actions/upload-artifact@v4
              with:
                  name: macos
                  path: |
                      dist/*.zip
                      dist/SHA256SUMS-macos.txt
                  if-no-files-found: error
    windows:
        name: Goosic (Windows, x64)
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-pc-windows-msvc
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '9.0.x'
            - run: cargo test --workspace
            - run: dotnet test apps/goosic-windows/Goosic.Windows.Tests/Goosic.Windows.Tests.csproj
            - name: Install Inno Setup
              run: choco install innosetup --no-progress -y
            - name: Build installer and portable archive
              run: |
                  $version = $env:GITHUB_REF_NAME.Substring(1)
                  ./apps/goosic-windows/build-installer.ps1 -Version $version
            - uses: actions/upload-artifact@v4
              with:
                  name: windows
                  path: |
                      dist/*-windows-x64.zip
                      dist/*-windows-x64-setup.exe
                      dist/SHA256SUMS.txt
                  if-no-files-found: error
    draft:
        name: Create the release draft
        needs: [macos, windows]
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
            - uses: actions/download-artifact@v4
              with:
                  path: downloads
            - uses: softprops/action-gh-release@v2
              with:
                  draft: true
                  prerelease: false
                  name: Goosic ${{ github.ref_name }}
                  body_path: docs/RELEASE_0.2.5.md
                  fail_on_unmatched_files: true
                  files: |
                      downloads/macos/*.zip
                      downloads/macos/SHA256SUMS-macos.txt
                      downloads/windows/*.zip
                      downloads/windows/*-setup.exe
                      downloads/windows/SHA256SUMS.txt

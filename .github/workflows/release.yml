name: Release

# Downloads stay draft until their hashes and contents have been checked.
on:
    push:
        tags: ['v*', '!v*-macos-*']
    workflow_dispatch:
        inputs:
            tag:
                description: Existing release tag to package
                required: true
                default: v0.2.5
            windows_run_id:
                description: Successful Windows artifact run for the same tag
                required: true
                default: '37398960736'
permissions:
    contents: write
    actions: read
env:
    RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
jobs:
    macos:
        name: Goosic.app (macOS, universal alpha)
        runs-on: macos-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ env.RELEASE_TAG }}
            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: latest-stable
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-apple-darwin,x86_64-apple-darwin
            - name: Test the release tree
              run: make test
            - name: Package and verify the app
              run: |
                  version="${RELEASE_TAG#v}"
                  GOOSIC_MACOS_BUILD_VERSION=3 sh tools/package-macos.sh "$version"
                  unzip -q "dist/Goosic-$version-macos-universal.zip" -d dist/verify
                  app=dist/verify/Goosic.app
                  codesign --verify --deep --strict "$app"
                  lipo "$app/Contents/MacOS/Goosic" -verify_arch arm64 x86_64
                  lipo "$app/Contents/MacOS/goosic-service" -verify_arch arm64 x86_64
                  test -d "$app/Contents/Frameworks/Sparkle.framework"
                  test -f "$app/Contents/Resources/LICENSE-GPL-3.0"
                  cd dist
                  shasum -a 256 "Goosic-$version-macos-universal.zip" > SHA256SUMS-macos.txt
            - uses: actions/upload-artifact@v4
              with:
                  name: macos
                  path: |
                      dist/*.zip
                      dist/SHA256SUMS-macos.txt
                  if-no-files-found: error
    windows:
        if: github.event_name != 'workflow_dispatch'
        name: Goosic (Windows, x64)
        runs-on: windows-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ env.RELEASE_TAG }}
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-pc-windows-msvc
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '9.0.x'
            - run: cargo test --workspace
            - run: dotnet test apps/goosic-windows/Goosic.Windows.Tests/Goosic.Windows.Tests.csproj
            - name: Install Inno Setup
              run: choco install innosetup --no-progress -y
            - name: Build installer and portable archive
              run: |
                  $version = $env:RELEASE_TAG.Substring(1)
                  ./apps/goosic-windows/build-installer.ps1 -Version $version
            - uses: actions/upload-artifact@v4
              with:
                  name: windows
                  path: |
                      dist/*-windows-x64.zip
                      dist/*-windows-x64-setup.exe
                      dist/SHA256SUMS.txt
                  if-no-files-found: error
    draft:
        name: Create the release draft
        needs: [macos, windows]
        if: >-
            always() && needs.macos.result == 'success'
            && (needs.windows.result == 'success' || needs.windows.result == 'skipped')
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ env.RELEASE_TAG }}
            - uses: actions/download-artifact@v4
              with:
                  path: downloads
            - name: Check the reused Windows run belongs to this source
              if: github.event_name == 'workflow_dispatch'
              env:
                  GH_TOKEN: ${{ github.token }}
                  WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
              run: |
                  [[ "$WINDOWS_RUN_ID" =~ ^[0-9]+$ ]]
                  source_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WINDOWS_RUN_ID" --jq .head_sha)
                  test "$source_sha" = "$(git rev-parse HEAD)"
                  result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WINDOWS_RUN_ID/jobs" --jq '.jobs[] | select(.name == "Goosic (Windows, x64)") | .conclusion')
                  test "$result" = success
            - name: Reuse verified Windows artifacts for a Mac retry
              if: github.event_name == 'workflow_dispatch'
              uses: actions/download-artifact@v4
              with:
                  name: windows
                  run-id: ${{ inputs.windows_run_id }}
                  github-token: ${{ github.token }}
                  path: downloads/windows
            - uses: softprops/action-gh-release@v2
              with:
                  draft: true
                  prerelease: false
                  name: Goosic ${{ env.RELEASE_TAG }}
                  tag_name: ${{ env.RELEASE_TAG }}
                  body_path: docs/RELEASE_0.2.5.md
                  fail_on_unmatched_files: true
                  files: |
                      downloads/macos/*.zip
                      downloads/macos/SHA256SUMS-macos.txt
                      downloads/windows/*.zip
                      downloads/windows/*-setup.exe
                      downloads/windows/SHA256SUMS.txt

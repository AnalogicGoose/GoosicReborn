name: Release

# Downloads stay draft until their hashes and contents have been checked.
#
# A deployment tags itself: when development is merged into main, the workflow reads the
# workspace version and, if that version has no tag yet, tags the merge and builds it. Other
# pushes to main (the CI workflow kept current there, a hotfix that did not move the version)
# find their version already tagged and build nothing. A tag pushed by hand still builds.
on:
    push:
        branches: [main]
        tags: ['v*', '!v*-macos-*']
    workflow_dispatch:
        inputs:
            tag:
                description: Existing release tag to package
                required: true
            windows_run_id:
                description: Successful Windows artifact run for the same tag
                required: true
permissions:
    contents: write
    actions: read
jobs:
    tag:
        name: Decide the release tag
        runs-on: ubuntu-latest
        outputs:
            tag: ${{ steps.decide.outputs.tag }}
            build: ${{ steps.decide.outputs.build }}
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0
            - id: decide
              env:
                  EVENT: ${{ github.event_name }}
                  INPUT_TAG: ${{ inputs.tag }}
                  REF_TYPE: ${{ github.ref_type }}
                  REF_NAME: ${{ github.ref_name }}
              run: |
                  set -euo pipefail
                  if [ "$EVENT" = workflow_dispatch ]; then
                      tag=$INPUT_TAG
                  elif [ "$REF_TYPE" = tag ]; then
                      tag=$REF_NAME
                  else
                      version=$(sed -n '/^\[workspace.package\]/,/^\[/s/^version = "\([^"]*\)"/\1/p' Cargo.toml)
                      tag="v$version"
                      if git rev-parse --verify --quiet "refs/tags/$tag" >/dev/null; then
                          echo "$tag is already tagged; this push to main is not a new release."
                          echo "build=false" >> "$GITHUB_OUTPUT"
                          exit 0
                      fi
                      # Pushed with GITHUB_TOKEN, so the tag does not start this workflow again.
                      git tag "$tag" "$GITHUB_SHA"
                      git push origin "refs/tags/$tag"
                  fi
                  echo "tag=$tag" >> "$GITHUB_OUTPUT"
                  echo "build=true" >> "$GITHUB_OUTPUT"
    macos:
        name: Goosic.app (macOS, universal alpha)
        needs: tag
        if: needs.tag.outputs.build == 'true'
        runs-on: macos-latest
        env:
            RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ env.RELEASE_TAG }}
            # Pinned, not latest-stable: actool from Xcode 26.4 through 26.6 throws on the
            # app icon on GitHub's runners, while 26.0 to 26.3 and Xcode 27 compile it.
            - uses: maxim-lobanov/setup-xcode@v1
              with:
                  xcode-version: '26.3'
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: aarch64-apple-darwin,x86_64-apple-darwin
            - name: Test the release tree
              run: make test
            - name: Package and verify the app
              run: |
                  version="${RELEASE_TAG#v}"
                  # The build number is derived from the version by the script; see RELEASING.md.
                  sh tools/package-macos.sh "$version"
                  unzip -q "dist/Goosic-$version-macos-universal.zip" -d dist/verify
                  app=dist/verify/Goosic.app
                  # Sparkle offers nothing whose build is not above the feed's newest item, so
                  # a collision fails here instead of after the release is published.
                  build=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$app/Contents/Info.plist")
                  newest=$(sed -n 's:.*<sparkle\:version>\([0-9]*\)</sparkle\:version>.*:\1:p' updates/macos-alpha.xml | sort -n | tail -1)
                  echo "CFBundleVersion $build; newest in the feed ${newest:-none}"
                  test "$build" -gt "${newest:-0}"
                  codesign --verify --deep --strict "$app"
                  lipo "$app/Contents/MacOS/Goosic" -verify_arch arm64 x86_64
                  lipo "$app/Contents/MacOS/goosic-service" -verify_arch arm64 x86_64
                  test -d "$app/Contents/Frameworks/Sparkle.framework"
                  test -f "$app/Contents/Resources/LICENSE-GPL-3.0"
                  cd dist
                  shasum -a 256 "Goosic-$version-macos-universal.zip" > SHA256SUMS-macos.txt
            - uses: actions/upload-artifact@v4
              with:
                  name: macos
                  path: |
                      dist/*.zip
                      dist/SHA256SUMS-macos.txt
                  if-no-files-found: error
    windows:
        needs: tag
        if: needs.tag.outputs.build == 'true' && github.event_name != 'workflow_dispatch'
        name: Goosic (Windows, x64)
        runs-on: windows-latest
        env:
            RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ env.RELEASE_TAG }}
            - uses: dtolnay/rust-toolchain@stable
              with:
                  targets: x86_64-pc-windows-msvc
            - uses: actions/setup-dotnet@v4
              with:
                  dotnet-version: '9.0.x'
            - run: cargo test --workspace
            - run: dotnet test apps/goosic-windows/Goosic.Windows.Tests/Goosic.Windows.Tests.csproj
            - name: Install Inno Setup
              run: choco install innosetup --no-progress -y
            - name: Build installer and portable archive
              run: |
                  $version = $env:RELEASE_TAG.Substring(1)
                  ./apps/goosic-windows/build-installer.ps1 -Version $version
            - uses: actions/upload-artifact@v4
              with:
                  name: windows
                  path: |
                      dist/*-windows-x64.zip
                      dist/*-windows-x64-setup.exe
                      dist/SHA256SUMS.txt
                  if-no-files-found: error
    draft:
        name: Create the release draft
        needs: [tag, macos, windows]
        if: >-
            always() && needs.macos.result == 'success'
            && (needs.windows.result == 'success' || needs.windows.result == 'skipped')
        runs-on: ubuntu-latest
        env:
            RELEASE_TAG: ${{ needs.tag.outputs.tag }}
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ env.RELEASE_TAG }}
            - uses: actions/download-artifact@v4
              with:
                  path: downloads
            # The notes are named after the version, so no release has to edit this file.
            # An experimental release is marked by its notes' first line, an HTML comment GitHub
            # does not render, so the version and every build stay exactly as a stable one's.
            - name: Find the notes
              run: |
                  notes="docs/RELEASE_${RELEASE_TAG#v}.md"
                  echo "NOTES=$notes" >> "$GITHUB_ENV"
                  # v0.4.7-beta.2 is titled "Goosic 0.4.7 beta 2", and a beta is always experimental.
                  echo "TITLE=Goosic $(printf '%s' "${RELEASE_TAG#v}" | sed 's/-beta\./ beta /')" >> "$GITHUB_ENV"
                  if head -n 1 "$notes" | grep -q '<!-- channel: experimental -->' || [[ "$RELEASE_TAG" == *-beta.* ]]; then
                      echo "PRERELEASE=true" >> "$GITHUB_ENV"
                  else
                      echo "PRERELEASE=false" >> "$GITHUB_ENV"
                  fi
            - name: Check the reused Windows run belongs to this source
              if: github.event_name == 'workflow_dispatch'
              env:
                  GH_TOKEN: ${{ github.token }}
                  WINDOWS_RUN_ID: ${{ inputs.windows_run_id }}
              run: |
                  [[ "$WINDOWS_RUN_ID" =~ ^[0-9]+$ ]]
                  source_sha=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WINDOWS_RUN_ID" --jq .head_sha)
                  test "$source_sha" = "$(git rev-parse HEAD)"
                  result=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$WINDOWS_RUN_ID/jobs" --jq '.jobs[] | select(.name == "Goosic (Windows, x64)") | .conclusion')
                  test "$result" = success
            - name: Reuse verified Windows artifacts for a Mac retry
              if: github.event_name == 'workflow_dispatch'
              uses: actions/download-artifact@v4
              with:
                  name: windows
                  run-id: ${{ inputs.windows_run_id }}
                  github-token: ${{ github.token }}
                  path: downloads/windows
            - uses: softprops/action-gh-release@v2
              with:
                  draft: true
                  prerelease: ${{ env.PRERELEASE == 'true' }}
                  make_latest: ${{ env.PRERELEASE == 'true' && 'false' || 'true' }}
                  name: ${{ env.TITLE }}
                  tag_name: ${{ env.RELEASE_TAG }}
                  body_path: ${{ env.NOTES }}
                  fail_on_unmatched_files: true
                  files: |
                      downloads/macos/*.zip
                      downloads/macos/SHA256SUMS-macos.txt
                      downloads/windows/*.zip
                      downloads/windows/*-setup.exe
                      downloads/windows/SHA256SUMS.txt

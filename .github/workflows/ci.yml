name: CI

# Every push and every pull request. The repository is public, so macOS and Windows
# runners cost nothing; what keeps this cheap is the caching and the cancellation below.
on:
    push:
    pull_request:
    # Only the default branch writes the build caches, and the default branch is `main`,
    # which builds solely at a deployment. A cache nobody refreshes is a cache nobody has, so
    # give `main` a reason to build: a scheduled run rebuilds it after a dependency bump
    # changes the key, and `workflow_dispatch` does it on demand. Scheduled runs always use
    # the default branch, which is exactly the branch that needs to hold the cache.
    schedule:
        -   cron: "17 4 * * 1"
    workflow_dispatch:

# A second push to the same branch makes the first run pointless. Cancel it.
concurrency:
    group: ${{ github.workflow }}-${{ github.ref }}
    cancel-in-progress: true

# Every branch may read a cache written by itself or by the default branch, and by nothing
# else — there is no reading a parent's. So a branch that writes its own copy helps only
# itself, and ten live branches storing one dependency tree each filled the repository's
# 10 GB allowance with ten copies of the same bytes. Let the default branch write and let
# everyone read it. Derived rather than hardcoded, because which branch is default has
# already changed twice and a stale name here would silently stop all caching.
env:
    IS_CACHE_WRITER: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}

jobs:
    # Decides what this run actually has to do, before spending a runner on it.
    guard:
        name: Decide what to build
        runs-on: ubuntu-latest
        outputs:
            known-good: ${{ steps.tree.outputs.known-good }}
            tree: ${{ steps.tree.outputs.tree }}
            rust: ${{ steps.paths.outputs.rust }}
            swift: ${{ steps.paths.outputs.swift }}
            linux: ${{ steps.paths.outputs.linux }}
        steps:
            -   uses: actions/checkout@v4
                with:
                    fetch-depth: 0

            # The passport. A git tree hash fingerprints the exact file contents, so a match
            # means these bytes already passed, whichever branch produced them. Ancestry would
            # be the wrong test: a merge result is the tested branch combined with whatever the
            # target gained meanwhile, and that combination may never have been compiled.
            -   name: Look for a tree that already passed
                id: tree
                run: |
                    TREE=$(git rev-parse HEAD^{tree})
                    echo "tree=$TREE" >> "$GITHUB_OUTPUT"
                    # A scheduled or hand-started run exists to rebuild the cache, and the
                    # passport would defeat it: this tree passed long ago, so every heavy job
                    # would skip and nothing would be written. Asking for the run is the answer.
                    EVENT="${{ github.event_name }}"
                    if [ "$EVENT" = "schedule" ] || [ "$EVENT" = "workflow_dispatch" ]; then
                        echo "known-good=false" >> "$GITHUB_OUTPUT"
                        echo "Run was asked for deliberately. Building even if tree $TREE passed."
                        exit 0
                    fi
                    if git ls-remote --exit-code --tags origin "refs/tags/ci-passed/$TREE" >/dev/null 2>&1; then
                        echo "known-good=true" >> "$GITHUB_OUTPUT"
                        echo "Tree $TREE already passed. Skipping the heavy jobs."
                    else
                        echo "known-good=false" >> "$GITHUB_OUTPUT"
                        echo "Tree $TREE is new."
                    fi

            # Documentation cannot break a build. The Rust crates feed the Rust workspace and the
            # GTK shell, which links two of them and runs the service; each shell's own directory
            # builds only that shell. Anything unclassifiable builds everything.
            -   name: See which parts of the tree changed
                id: paths
                run: |
                    RUST=false; SWIFT=false; LINUX=false
                    BEFORE="${{ github.event.before }}"
                    if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
                        RUST=true; SWIFT=true; LINUX=true
                    else
                        CHANGED=$(git diff --name-only "$BEFORE" HEAD)
                        echo "$CHANGED"
                        CODE=$(echo "$CHANGED" | grep -vE '^(docs/|\.claude/|[^/]*\.md$)' || true)
                        while IFS= read -r FILE; do
                            [ -z "$FILE" ] && continue
                            case "$FILE" in
                                crates/*|Cargo.toml|Cargo.lock) RUST=true; LINUX=true ;;
                                apps/goosic-linux/*)            LINUX=true ;;
                                apps/goosic-swift/*)            SWIFT=true ;;
                                *)                              RUST=true; SWIFT=true; LINUX=true ;;
                            esac
                        done <<< "$CODE"
                    fi
                    # The GTK shell lives on platform/linux and its feature branches. Where it does
                    # not exist there is nothing to build, and a job failing on a missing directory
                    # would be a red run about nothing.
                    if [ ! -f apps/goosic-linux/Cargo.toml ]; then
                        LINUX=false
                    fi
                    echo "rust=$RUST"   >> "$GITHUB_OUTPUT"
                    echo "swift=$SWIFT" >> "$GITHUB_OUTPUT"
                    echo "linux=$LINUX" >> "$GITHUB_OUTPUT"

    # The Rust workspace is portable by design: rusqlite is bundled and ureq uses rustls,
    # so there is no system SQLite or OpenSSL to install on any of the three.
    rust:
        name: Rust (${{ matrix.os }})
        needs: guard
        if: needs.guard.outputs.known-good == 'false' && needs.guard.outputs.rust == 'true'
        runs-on: ${{ matrix.os }}
        # Windows has never been built here. Report it, do not block on it.
        continue-on-error: ${{ matrix.os == 'windows-latest' }}
        strategy:
            fail-fast: false
            matrix:
                os: [ubuntu-latest, macos-latest, windows-latest]
        steps:
            - uses: actions/checkout@v4
            - uses: dtolnay/rust-toolchain@stable
            - uses: Swatinem/rust-cache@v2
              with:
                  save-if: ${{ env.IS_CACHE_WRITER == 'true' }}
            # Not `make test-rust`: nmake on Windows is not GNU make.
            - run: cargo test --workspace

    # The Rust GTK 4 shell in `apps/goosic-linux`, which replaces the Swift build on Linux. Its
    # floor is GTK 4.20 and the hosted Ubuntu image carries an older GTK, so it builds in a Fedora
    # container whose GTK, WebKitGTK, GStreamer and Rust are all current; the Flatpak builder on
    # the GNOME runtime takes over once the manifest exists. The service is built first because
    # the shell's integration test runs it. Nothing here needs a display or a sound card: the
    # GStreamer test decodes a WAV paused, and no test opens a window.
    shell-gtk:
        name: Shell (Linux, GTK 4, Rust)
        needs: guard
        if: needs.guard.outputs.known-good == 'false' && needs.guard.outputs.linux == 'true'
        runs-on: ubuntu-latest
        container: fedora:44
        steps:
            # Git before the checkout, so the checkout is a repository rather than a tarball.
            -   name: Install GTK 4, WebKitGTK, GStreamer, libsoup and Rust
                run: |
                    dnf install -y --setopt=install_weak_deps=False \
                        git gcc pkgconf-pkg-config \
                        gtk4-devel webkitgtk6.0-devel libsoup3-devel \
                        gstreamer1-devel gstreamer1-plugins-base-devel gstreamer1-plugins-good \
                        rust cargo clippy

            -   uses: actions/checkout@v4

            -   uses: Swatinem/rust-cache@v2
                with:
                    workspaces: |
                        . -> target
                        apps/goosic-linux -> target
                    save-if: ${{ env.IS_CACHE_WRITER == 'true' }}

            -   run: cargo build -p goosic-service

            -   name: Lint the shell
                working-directory: apps/goosic-linux
                run: cargo clippy --all-targets -- -D warnings

            -   name: Test the shell
                working-directory: apps/goosic-linux
                run: cargo test

    # The Swift package's Linux build through SwiftCrossUI. It is the conformance reference the
    # GTK shell is compared against and is deleted once that shell ships, as docs/LINUX_SHELL.md
    # says. `make test-swift` needs no display: the tests are units and open no window.
    shell-linux:
        name: Shell (Linux, SwiftCrossUI reference)
        needs: guard
        if: needs.guard.outputs.known-good == 'false' && needs.guard.outputs.swift == 'true'
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v4

            # CGtk resolves gtk4 and CWebKitGTK resolves webkitgtk-6.0, both through pkg-config.
            -   name: Install GTK 4 and WebKitGTK
                run: |
                    sudo apt-get update
                    sudo apt-get install -y --no-install-recommends \
                        libgtk-4-dev libwebkitgtk-6.0-dev libglib2.0-dev \
                        libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev \
                        gstreamer1.0-plugins-good pkg-config clang

            # 6.2, not 6.0: the pinned swift-log 1.15 declares swift-tools-version 6.2, and an
            # older toolchain fails on that manifest before compiling anything of Goosic's.
            -   uses: swift-actions/setup-swift@v2
                with:
                    swift-version: "6.2"

            # Keyed on Package.resolved: dependencies are pinned, so the key only moves when
            # they do. The path is the scratch directory the Makefile uses on Linux.
            -   name: Restore the Swift build
                id: swift-build-cache
                uses: actions/cache/restore@v4
                with:
                    path: ~/.cache/goosic-swift-build
                    key: swift-linux-${{ hashFiles('apps/goosic-swift/Package.resolved') }}
                    restore-keys: swift-linux-

            -   run: make build-swift
            -   run: make test-swift

            # Split from the restore because `actions/cache` writes unconditionally and only
            # the default branch may write here. Skipped on an exact hit too: the key is the
            # dependency fingerprint, so an existing entry is already the answer, and writing
            # a duplicate key is an error rather than a refresh.
            #
            # The key comes from the restore rather than being spelled out again. `swift build`
            # rewrites `Package.resolved` when the toolchain's SwiftPM formats it differently,
            # so recomputing the hash here stores the build under a key no restore will ever
            # ask for, and the entry can only ever be found by the prefix fallback.
            -   name: Save the Swift build
                if: env.IS_CACHE_WRITER == 'true' && steps.swift-build-cache.outputs.cache-hit != 'true'
                uses: actions/cache/save@v4
                with:
                    path: ~/.cache/goosic-swift-build
                    key: ${{ steps.swift-build-cache.outputs.cache-primary-key }}

    shell-macos:
        name: Shell (macOS, AppKit)
        needs: guard
        if: needs.guard.outputs.known-good == 'false' && needs.guard.outputs.swift == 'true'
        runs-on: macos-latest
        steps:
            -   uses: actions/checkout@v4

            # The package declares swift-tools-version 6.0. An older Xcode fails on the
            # manifest itself, with an error that says nothing about the actual code.
            -   uses: maxim-lobanov/setup-xcode@v1
                with:
                    xcode-version: latest-stable
            
            -   name: Restore the Swift build
                id: swift-build-cache
                uses: actions/cache/restore@v4
                with:
                    path: ~/Library/Caches/goosic-swift-build
                    key: swift-macos-${{ hashFiles('apps/goosic-swift/Package.resolved') }}
                    restore-keys: swift-macos-

            -   run: make build-swift
            -   run: make test-swift

            -   name: Save the Swift build
                if: env.IS_CACHE_WRITER == 'true' && steps.swift-build-cache.outputs.cache-hit != 'true'
                uses: actions/cache/save@v4
                with:
                    path: ~/Library/Caches/goosic-swift-build
                    key: ${{ steps.swift-build-cache.outputs.cache-primary-key }}

    # The stamp, and it only goes on a tree the heavy jobs actually compiled. A tree skipped
    # because just documentation moved is never claimed to have been built.
    seal:
        name: Stamp this tree as passing
        needs: [guard, rust, shell-gtk, shell-linux, shell-macos]
        if: >-
            always()
            && needs.guard.outputs.known-good == 'false'
            && needs.guard.outputs.rust == 'true'
            && needs.guard.outputs.swift == 'true'
            && !contains(needs.*.result, 'failure')
            && !contains(needs.*.result, 'cancelled')
        runs-on: ubuntu-latest
        steps:
            # The repository's default GITHUB_TOKEN is read-only, and opening it up for every
            # workflow to write one tag would be the wrong trade. Reuse the propagation token.
            -   uses: actions/checkout@v4
                with:
                    token: ${{ secrets.PROPAGATE_TOKEN }}
            -   name: Tag the tree
                run: |
                    TREE="${{ needs.guard.outputs.tree }}"
                    git tag "ci-passed/$TREE" || exit 0
                    git push origin "refs/tags/ci-passed/$TREE" || true
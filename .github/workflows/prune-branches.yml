name: Prune merged branches

# Weekly, plus a manual run that defaults to a dry run so the list can be read before
# anything is deleted.
on:
    schedule:
        -   cron: "0 4 * * 1"
    workflow_dispatch:
        inputs:
            dry_run:
                description: "List what would be deleted without deleting it"
                type: boolean
                default: true

jobs:
    prune:
        runs-on: ubuntu-latest
        steps:
            -   uses: actions/checkout@v5
                with:
                    fetch-depth: 0
                    token: ${{ secrets.PROPAGATE_TOKEN }}

            -   name: Prune branches already contained in an integration branch
                env:
                    GH_TOKEN: ${{ secrets.PROPAGATE_TOKEN }}
                    DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}
                run: |
                    set -euo pipefail
                    git fetch --quiet --prune origin
                    OPEN_REFS=$(gh pr list --state open --limit 1000 --json headRefName,baseRefName \
                        --jq '.[] | .headRefName, .baseRefName')

                    git for-each-ref --format='%(objectname) %(refname:lstrip=3)' refs/remotes/origin |
                    while read -r SHA BRANCH; do
                        case "$BRANCH" in
                            feature/*|fix/*|docs/*|refactor/*|release/*|hotfix/*|propagate-*) ;;
                            *) continue ;;
                        esac
                        if grep -Fxq -- "$BRANCH" <<< "$OPEN_REFS"; then
                            continue
                        fi

                        # Give recently updated branches a week before pruning them.
                        AGE=$(( ($(date +%s) - $(git log -1 --format=%ct "$SHA")) / 86400 ))
                        if [ "$AGE" -lt 7 ]; then
                            continue
                        fi

                        for PARENT in development main platform/linux; do
                            if git merge-base --is-ancestor "$SHA" "origin/$PARENT" 2>/dev/null; then
                                if [ "$DRY_RUN" = true ]; then
                                    echo "would delete $BRANCH ($SHA), contained in $PARENT"
                                else
                                    echo "delete $BRANCH ($SHA), contained in $PARENT"
                                    git push --quiet --force-with-lease="refs/heads/$BRANCH:$SHA" \
                                        origin ":refs/heads/$BRANCH"
                                fi
                                break
                            fi
                        done
                    done

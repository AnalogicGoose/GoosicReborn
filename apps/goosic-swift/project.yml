name: GoosicPreview

options:
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  # An Icon Composer document is a directory that actool compiles as one asset, like .xcassets.
  fileTypes:
    icon:
      file: true
      buildPhase: resources

packages:
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle.git
    exactVersion: 2.10.0
targets:
  GoosicPreview:
    type: application
    platform: macOS
    sources:
      - path: Sources/GoosicSwift
        excludes:
          - Resources
      - path: PreviewSupport
      - path: Goosic.icon
    resources:
      - path: Sources/GoosicSwift/Resources
    dependencies:
      - package: Sparkle
        product: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.goosic.preview
        PRODUCT_NAME: Goosic
        ASSETCATALOG_COMPILER_APPICON_NAME: Goosic
        GENERATE_INFOPLIST_FILE: YES
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        SWIFT_VERSION: "6.0"
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) GOOSIC_PREVIEW_NO_WEBKIT"
      configs:
        Debug:
          ENABLE_DEBUG_DYLIB: YES
          SWIFT_OPTIMIZATION_LEVEL: -Onone

schemes:
  GoosicPreview:
    build:
      targets:
        GoosicPreview: all
    run:
      config: Debug
      environmentVariables:
        GOOSIC_SERVICE_PATH:
          value: ../../target/debug/goosic-service
          isEnabled: true
    test:
      config: Debug
